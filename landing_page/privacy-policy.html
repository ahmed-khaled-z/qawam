<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Qawam Privacy Policy — Learn how we protect your data.">
  <meta property="og:title" content="Privacy Policy — Qawam">
  <meta property="og:type" content="website">
  <title>Privacy Policy — Qawam</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar navbar--scrolled" id="navbar">
    <nav class="navbar__inner container" aria-label="Main navigation">
      <a href="/" class="navbar__brand" aria-label="Qawam Home">
        <img src="assets/images/logo.png" alt="Qawam Logo" class="navbar__logo">
        <span class="navbar__name" id="nav-brand-name"></span>
      </a>
      <div class="navbar__actions">
        <button class="lang-switcher" id="lang-switcher" type="button" aria-label="Switch language">
          <span class="lang-switcher__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </span>
          <span class="lang-switcher__label" id="lang-label"></span>
        </button>
        <a href="/" class="btn btn--primary btn--sm" id="back-home"></a>
      </div>
    </nav>
  </header>

  <main class="legal-page">
    <article class="legal container">
      <div class="legal__header">
        <h1 class="legal__title" id="legal-title"></h1>
        <p class="legal__date" id="legal-date"></p>
      </div>
      <p class="legal__intro" id="legal-intro"></p>
      <div class="legal__body" id="legal-body"></div>
    </article>
  </main>

  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer__bottom">
        <p class="footer__copyright" id="footer-copyright"></p>
      </div>
    </div>
  </footer>

  <script src="legal.js" data-page="privacy"></script>
</body>
</html>
