<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <title>Qawam</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-glow bg-glow--1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--2" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--3" aria-hidden="true"></div>

  <!-- Navigation -->
  <header class="navbar" id="navbar">
    <nav class="navbar__inner container" aria-label="Main navigation">
      <a href="#" class="navbar__brand" aria-label="Qawam Home">
        <img id="nav-logo" src="" alt="" class="navbar__logo">
        <span class="navbar__name" id="nav-brand-name"></span>
      </a>
      <ul class="navbar__links" id="nav-links" role="list"></ul>
      <div class="navbar__actions">
        <button class="lang-switcher" id="lang-switcher" type="button" aria-label="Switch language">
          <span class="lang-switcher__icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </span>
          <span class="lang-switcher__label" id="lang-label"></span>
        </button>
        <a href="#download" class="btn btn--primary btn--sm navbar__cta" id="nav-cta"></a>
      </div>
      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
    <ul class="mobile-menu__links" id="mobile-nav-links" role="list"></ul>
  </div>

  <main>
    <!-- Hero Section -->
    <section class="hero" id="hero">
      <div class="hero__inner container">
        <div class="hero__content">
          <span class="badge" id="hero-badge"></span>
          <h1 class="hero__title" id="hero-title"></h1>
          <p class="hero__subtitle" id="hero-subtitle"></p>
          <div class="hero__actions" id="hero-actions"></div>
          <div class="hero__stats" id="hero-stats"></div>
        </div>
        <div class="hero__visual">
          <div class="hero__logo-wrapper">
            <div class="hero__logo-glow" aria-hidden="true"></div>
            <img id="hero-logo" src="" alt="" class="hero__logo">
          </div>
        </div>
      </div>
      <div class="hero__wave" aria-hidden="true">
        <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
          <path d="M0,60 C360,120 720,0 1080,60 C1260,90 1380,70 1440,60 L1440,120 L0,120 Z" fill="var(--color-bg)"/>
        </svg>
      </div>
    </section>

    <!-- Features Section -->
    <section class="features section" id="features">
      <div class="container">
        <div class="section__header">
          <span class="badge" id="features-badge"></span>
          <h2 class="section__title" id="features-title"></h2>
          <p class="section__subtitle" id="features-subtitle"></p>
        </div>
        <div class="features__grid" id="features-grid"></div>
      </div>
    </section>

    <!-- How It Works Section -->
    <section class="how-it-works section" id="how-it-works">
      <div class="container">
        <div class="section__header">
          <span class="badge" id="hiw-badge"></span>
          <h2 class="section__title" id="hiw-title"></h2>
          <p class="section__subtitle" id="hiw-subtitle"></p>
        </div>
        <div class="how-it-works__steps" id="hiw-steps"></div>
      </div>
    </section>

    <!-- Preview Section -->
    <section class="preview section" id="preview">
      <div class="container">
        <div class="section__header">
          <span class="badge" id="preview-badge"></span>
          <h2 class="section__title" id="preview-title"></h2>
          <p class="section__subtitle" id="preview-subtitle"></p>
        </div>
        <div class="preview__grid" id="preview-grid"></div>
      </div>
    </section>

    <!-- Download Section -->
    <section class="download section" id="download">
      <div class="container">
        <div class="download__inner">
          <div class="download__content">
            <span class="badge badge--light" id="download-badge"></span>
            <h2 class="download__title" id="download-title"></h2>
            <p class="download__subtitle" id="download-subtitle"></p>
            <div class="download__stores" id="download-stores"></div>
            <ul class="download__features" id="download-features"></ul>
          </div>
          <div class="download__visual">
            <img id="download-logo" src="" alt="" class="download__logo">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer__top">
        <div class="footer__brand">
          <a href="#" class="footer__logo-link" aria-label="Qawam Home">
            <img id="footer-logo" src="" alt="" class="footer__logo">
            <span class="footer__name" id="footer-brand-name"></span>
          </a>
          <p class="footer__desc" id="footer-desc"></p>
          <div class="footer__social" id="footer-social"></div>
        </div>
        <div class="footer__columns" id="footer-columns"></div>
      </div>
      <div class="footer__bottom">
        <p class="footer__copyright" id="footer-copyright"></p>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
